[package]
name = "cubacadabra-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["metal"]
metal = ["wgpu/metal"]
android-backends = ["wgpu/vulkan", "wgpu/gles"]
web-renderer = []
dev-showcase = []

[[bin]]
name = "magic_characters_capture"
path = "src/bin/magic_characters_capture.rs"
required-features = ["dev-showcase"]

[[bin]]
name = "validate_character_assets"
path = "src/bin/validate_character_assets.rs"
required-features = ["dev-showcase"]

[dependencies]
fontdue = "0.9"
log = "0.4"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
glam = "0.30"
mlua = { version = "0.12.1", default-features = false, features = ["luau", "vendored"] }
pollster = "0.4"
raw-window-handle = "0.6"
wgpu = { version = "29.0.1", default-features = false, features = ["wgsl", "metal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
glam = "0.30"
js-sys = "0.3"
luaur-rt = { version = "0.1.8", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance"] }
wgpu = { version = "29.0.1", default-features = false, features = ["wgsl", "webgpu", "webgl"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
