[workspace]
members = [".", "crates/app", "crates/client", "crates/morphs"]
resolver = "3"

[package]
name = "cubacadabra-engine"
version = "0.3.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["rendering", "metal"]
rendering = [
    "dep:bytemuck",
    "dep:fontdue",
    "dep:png",
    "dep:pollster",
    "dep:raw-window-handle",
    "dep:wgpu",
]
metal = ["rendering", "wgpu/metal"]
android-backends = ["rendering", "wgpu/vulkan", "wgpu/gles"]
desktop-backends = ["rendering", "wgpu/dx12", "wgpu/vulkan", "wgpu/gles"]
studio-ui = ["rendering"]
web-renderer = ["rendering"]
dev-showcase = ["rendering"]
headless = []

[[bin]]
name = "magic_characters_capture"
path = "src/bin/magic_characters_capture.rs"
required-features = ["dev-showcase"]

[[bin]]
name = "validate_character_assets"
path = "src/bin/validate_character_assets.rs"
required-features = ["dev-showcase"]

[[bin]]
name = "headless"
path = "src/bin/headless.rs"
required-features = ["headless"]

[dependencies]
cubacadabra-morphs = { path = "crates/morphs" }
fontdue = { version = "0.9", optional = true }
log = "0.4"
png = { version = "0.17", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytemuck = { version = "1.23", optional = true, features = ["derive"] }
glam = "0.30"
mlua = { version = "0.12.1", default-features = false, features = ["luau", "vendored"] }
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
wgpu = { version = "29.0.1", default-features = false, optional = true, features = ["wgsl", "metal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
glam = "0.30"
js-sys = "0.3"
luaur-rt = { version = "0.1.8", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance"] }
wgpu = { version = "29.0.1", default-features = false, features = ["wgsl", "webgpu", "webgl"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
