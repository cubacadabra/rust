[package]
name = "cubacadabra-client"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = []
metal = ["cubacadabra-engine/metal"]
android-backends = ["cubacadabra-engine/android-backends"]
desktop-backends = ["cubacadabra-engine/desktop-backends"]
studio-ui = ["cubacadabra-engine/studio-ui"]
web-renderer = ["cubacadabra-engine/web-renderer"]

[dependencies]
cubacadabra-engine = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
